name: 💡 功能建议
description: 为 DSHL 提议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 描述你遇到的痛点或场景
      placeholder: 每次……的时候都很麻烦，因为……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 DSHL 怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
      description: 有没有其他解决思路？
  - type: textarea
    id: context
    attributes:
      label: 补充说明（可选）
      description: 截图、参考链接等任何有助于理解的材料
